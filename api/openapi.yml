openapi: 3.0.3

info:
  title: Apple Music CLI API
  version: 1.0.0
  license:
    name: UNLICENSED
    url: https://choosealicense.com/no-permission/
  description: |
    내가 이미 가진 음악을 자연어로 파고, 왜 골랐는지 말해주고,
    스킵하면 배우는 터미널 뮤직 플레이어의 서버 API.

    ## 설계 원칙

    1. **자연어 요청은 비동기 잡이다.** `POST /sessions/{sessionId}/turns` 는 `202` 를
       반환하고, 클라이언트는 `GET /turns/{turnId}` 로 진행 상태를 조회한다.
       LLM 호출(L2~L4)이 초 단위이므로 입력창을 막지 않기 위한 구조다.
    2. **라이브러리 동기화도 비동기 잡이다.** `POST /library/sync-runs` → `202`.
    3. **화면의 모든 예외(E1~E10)가 에러 코드로 대응된다.** 아래 표 참조.
    4. **AI 실패는 잡의 `failed` 상태로 표현되고, 재생은 막지 않는다.**

    ## 화면 예외 ↔ 에러 코드

    | 화면 예외 | HTTP | code |
    |---|---|---|
    | E1 자동화 권한 거부 | 403 | `AUTOMATION_PERMISSION_DENIED` |
    | E2 Music.app 미실행 | 503 | `MUSIC_APP_NOT_RUNNING` |
    | E3 동기화 진행 중 | 409 | `SYNC_IN_PROGRESS` |
    | E4 큐 생성 실패 | 502 | `MODEL_UNAVAILABLE` |
    | E5 조건에 맞는 곡 없음 | 422 | `NO_MATCHING_TRACKS` |
    | E6 곡이 로컬에 없음 | 409 | `TRACK_NOT_AVAILABLE_LOCALLY` |
    | E7 카탈로그 접근 불가 | 502 | `CATALOG_UNAVAILABLE` |
    | E8 재편성 충돌 | 409 | `TURN_ALREADY_RUNNING` |
    | E9 마이크 권한 거부 | 403 | `MICROPHONE_PERMISSION_DENIED` |
    | E10 인식 실패 | 422 | `NO_MATCH_FOUND` |

    ## 범위 밖

    **Security Schemes 는 과제 명세에 따라 정의하지 않는다.**
    단일 사용자 로컬 서버를 전제하므로 `401` 응답도 정의하지 않는다.

servers:
  - url: http://localhost:8787/v1
    description: 로컬 서버

tags:
  - name: library
    description: 라이브러리 동기화와 진단 (F6)
  - name: tracks
    description: 곡 조회 · 묘비 · 유사곡 (F7, F8)
  - name: sessions
    description: 청취 세션과 자연어 요청 (F1, F2, F3)
  - name: queue
    description: 재생 큐와 반응 (F2, F4)
  - name: taste-rules
    description: 취향 규칙 (F5)
  - name: playlists
    description: 플레이리스트 저장 (F9)
  - name: recognitions
    description: Shazam 인식과 라이브러리 대조 (F10, F11)

paths:
  # ===================================================================
  #  library — S3 진단 화면
  # ===================================================================
  /library/diagnosis:
    get:
      tags: [library]
      operationId: getLibraryDiagnosis
      summary: 라이브러리 진단 지표 조회
      description: |
        S3 진단 화면 전체를 채운다. **서비스의 문제 정의를 사용자 본인의
        데이터로 증명하는 화면**이므로 미재생 곡 수와 비율이 핵심 필드다.
      responses:
        '200':
          description: 진단 지표
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryDiagnosis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /library/sync-runs:
    get:
      tags: [library]
      operationId: listSyncRuns
      summary: 동기화 이력 조회
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 동기화 이력
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncRun'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [library]
      operationId: createSyncRun
      summary: 라이브러리 동기화 시작 (비동기)
      description: |
        Music.app 에서 전곡 메타데이터를 읽어 저장하고, 신규 곡에 대해
        L1 무드 태깅을 수행한다. 즉시 `202` 를 반환한다.
      responses:
        '202':
          description: 동기화 잡이 생성되었다
          headers:
            Location:
              description: 생성된 잡의 조회 경로
              schema:
                type: string
                example: /v1/library/sync-runs/41
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /library/sync-runs/{syncRunId}:
    parameters:
      - $ref: '#/components/parameters/SyncRunId'
    get:
      tags: [library]
      operationId: getSyncRun
      summary: 동기화 잡 상태 조회
      responses:
        '200':
          description: 잡 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
        '404':
          $ref: '#/components/responses/NotFound'

  /library/tracks:
    post:
      tags: [library]
      operationId: addLibraryTrack
      summary: 카탈로그 곡을 라이브러리에 추가
      description: |
        S5 인식 결과에서 **라이브러리에 없는 곡**을 담을 때 사용한다 (F11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLibraryTrackRequest'
      responses:
        '201':
          description: 추가된 곡
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ===================================================================
  #  tracks — S2 묘비 화면
  # ===================================================================
  /tracks:
    get:
      tags: [tracks]
      operationId: listTracks
      summary: 곡 목록 조회 (묘비 포함)
      description: |
        `filter=never_played` 가 **묘비 화면(S2)의 기본 질의**다.
        `last_played_at IS NULL` 인 곡을 돌려준다.
      parameters:
        - name: filter
          in: query
          description: 조회 기준
          schema:
            type: string
            enum: [all, never_played, not_played_since, excluded]
            default: all
        - name: since
          in: query
          description: '`filter=not_played_since` 일 때의 기준일'
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: 제목·아티스트 부분 일치
          schema:
            type: string
        - name: tag
          in: query
          description: 태그명으로 필터 (복수 지정 시 AND)
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: sort
          in: query
          schema:
            type: string
            enum: [added_at_desc, last_played_at_asc, play_count_asc, title_asc]
            default: added_at_desc
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 곡 목록
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Track'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'

  /tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [tracks]
      operationId: getTrack
      summary: 곡 상세 조회
      responses:
        '200':
          description: 곡
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tracks]
      operationId: updateTrack
      summary: 곡 제외 표시 변경 (묘비 정리)
      description: |
        F7 의 "정리"는 **제외 표시까지만** 한다. 원본 파일이나
        Music.app 라이브러리에서 삭제하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrackRequest'
      responses:
        '200':
          description: 변경된 곡
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /tracks/{trackId}/similar:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [tracks]
      operationId: listSimilarCatalogTracks
      summary: 카탈로그에서 유사곡 조회 (F8)
      description: |
        죽은 곡을 실마리로 Apple Music 카탈로그를 조회한다.
        **바깥으로 나가되 출발점은 내 라이브러리 안쪽**이라는 점이 F8 의 전부다.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 카탈로그 유사곡
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  seedTrackId:
                    type: integer
                    format: int64
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogTrack'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /artists:
    get:
      tags: [tracks]
      operationId: listArtists
      summary: 아티스트 검색
      description: '`@` 멘션 자동완성에 사용한다.'
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 아티스트 목록
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artist'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ===================================================================
  #  sessions — S1 재생 뷰
  # ===================================================================
  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: 청취 세션 목록 (A8 재개)
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SessionStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 세션 목록
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [sessions]
      operationId: createSession
      summary: 청취 세션 생성
      description: |
        세션만 만든다. 큐 생성은 `POST /sessions/{sessionId}/turns` 가 담당한다.
        `prompt` 를 함께 보내면 첫 턴을 즉시 시작한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: 생성된 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: getSession
      summary: 세션 조회 (큐 포함)
      description: S1 재생 뷰를 한 번에 복원하는 데 필요한 값을 모두 담는다.
      responses:
        '200':
          description: 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [sessions]
      operationId: updateSession
      summary: 세션 종료 · 제목 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: 변경된 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{sessionId}/turns:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: listTurns
      summary: 세션의 자연어 요청 이력
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 턴 목록
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Turn'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [sessions]
      operationId: createTurn
      summary: 자연어 요청 (비동기)
      description: |
        큐 생성(F1) · 재편성(F3) · 근거 질의 · 반응 표명을 모두 이 하나로 받는다.
        의도 분류는 서버(L2)가 한다.

        즉시 `202` 를 반환하고 `status=queued` 인 턴을 준다.
        클라이언트는 `GET /turns/{turnId}` 로 완료를 확인한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTurnRequest'
      responses:
        '202':
          description: 턴이 접수되었다
          headers:
            Location:
              schema:
                type: string
                example: /v1/turns/882
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /turns/{turnId}:
    parameters:
      - $ref: '#/components/parameters/TurnId'
    get:
      tags: [sessions]
      operationId: getTurn
      summary: 턴 상태·결과 조회
      description: |
        `status` 가 `succeeded` 가 되면 `queueItems` 에 결과가 담긴다.
        `failed` 인 경우 `error` 에 사유가 담기며, **이때에도 기존 큐의 재생은 계속된다.**
      responses:
        '200':
          description: 턴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [sessions]
      operationId: cancelTurn
      summary: 진행 중인 턴 취소 (Ctrl+C)
      responses:
        '204':
          description: 취소되었다
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ===================================================================
  #  queue — S1 재생 뷰
  # ===================================================================
  /sessions/{sessionId}/queue-items:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [queue]
      operationId: listQueueItems
      summary: 재생 큐 조회
      responses:
        '200':
          description: 큐
          content:
            application/json:
              schema:
                type: object
                required: [data, summary]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueueItem'
                  summary:
                    $ref: '#/components/schemas/QueueSummary'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [queue]
      operationId: createQueueItem
      summary: 큐에 곡 투입
      description: |
        묘비에서 되살리기(`origin=revive`), 인식 결과에서 투입(`origin=recognition`),
        직접 추가(`origin=manual`) 가 모두 이 엔드포인트를 쓴다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQueueItemRequest'
      responses:
        '201':
          description: 추가된 큐 항목
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /queue-items/{queueItemId}:
    parameters:
      - $ref: '#/components/parameters/QueueItemId'
    patch:
      tags: [queue]
      operationId: updateQueueItem
      summary: 큐 항목 상태·순서 변경
      description: 재생 상태 폴링이 감지한 전이(`playing` → `played`)를 반영한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQueueItemRequest'
      responses:
        '200':
          description: 변경된 큐 항목
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [queue]
      operationId: deleteQueueItem
      summary: 큐에서 제거
      responses:
        '204':
          description: 제거되었다
        '404':
          $ref: '#/components/responses/NotFound'

  /queue-items/{queueItemId}/reactions:
    parameters:
      - $ref: '#/components/parameters/QueueItemId'
    post:
      tags: [queue]
      operationId: createReaction
      summary: 반응 기록 (F4)
      description: |
        **대부분의 반응은 사용자가 아니라 클라이언트의 재생 위치 폴링이 보낸다**
        (`detectedBy=poll`). 3초 이내 이탈은 `skip_early` 로 기록된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReactionRequest'
      responses:
        '201':
          description: 기록된 반응
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================================================================
  #  taste-rules — S4
  # ===================================================================
  /taste-rules:
    get:
      tags: [taste-rules]
      operationId: listTasteRules
      summary: 취향 규칙 목록 (F5)
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 규칙 목록
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TasteRule'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'

  /taste-rules/{tasteRuleId}:
    parameters:
      - $ref: '#/components/parameters/TasteRuleId'
    patch:
      tags: [taste-rules]
      operationId: updateTasteRule
      summary: 규칙 수정·비활성화
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTasteRuleRequest'
      responses:
        '200':
          description: 변경된 규칙
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasteRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [taste-rules]
      operationId: deleteTasteRule
      summary: 규칙 삭제
      responses:
        '204':
          description: 삭제되었다
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================================================================
  #  playlists — F9
  # ===================================================================
  /playlists:
    get:
      tags: [playlists]
      operationId: listPlaylists
      summary: 플레이리스트 목록
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 플레이리스트 목록
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Playlist'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: 현재 큐를 플레이리스트로 저장 (F9)
      description: |
        서버에 저장한 뒤 Music.app 에도 생성한다. Music.app 반영에 실패해도
        서버 저장은 유지되며 `appleMusicPlaylistId` 가 `null` 로 남는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '201':
          description: 생성된 플레이리스트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ===================================================================
  #  recognitions — S5 (F10, F11)
  # ===================================================================
  /recognitions:
    get:
      tags: [recognitions]
      operationId: listRecognitions
      summary: 인식 이력 조회
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 인식 이력
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recognition'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [recognitions]
      operationId: createRecognition
      summary: 인식 결과 등록 및 라이브러리 대조 (F10 · F11)
      description: |
        ShazamKit 헬퍼가 얻은 결과를 서버에 등록하면, 서버가
        `appleMusicId` 와 `isrc` **정확 일치**로 라이브러리를 대조한다.

        > **대조에 AI 를 쓰지 않는다.** "내 라이브러리에 있는가"는 판정이지
        > 해석이 아니며, 확률적으로 답하면 F11 의 주장 자체가 무너진다.

        일치하는 곡이 있으면 `matchedTrack` 이 채워지고, 그 곡의
        `lastPlayedAt` 이 `null` 이면 **담아두고 한 번도 듣지 않은 곡**이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecognitionRequest'
      responses:
        '201':
          description: 등록된 인식 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recognition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /recognitions/{recognitionId}:
    parameters:
      - $ref: '#/components/parameters/RecognitionId'
    get:
      tags: [recognitions]
      operationId: getRecognition
      summary: 인식 결과 조회
      responses:
        '200':
          description: 인식 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recognition'
        '404':
          $ref: '#/components/responses/NotFound'

# =====================================================================
#  components
# =====================================================================
components:

  parameters:
    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    QueueItemId:
      name: queueItemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TasteRuleId:
      name: tasteRuleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RecognitionId:
      name: recognitionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SyncRunId:
      name: syncRunId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      description: 한 번에 가져올 개수
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: 다음 페이지 커서
      schema:
        type: string

  responses:
    BadRequest:
      description: 요청 형식이 잘못되었다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_FAILED
            message: 'position 은 0 이상이어야 합니다'
    Forbidden:
      description: macOS 권한이 거부되었다 (E1, E9)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTOMATION_PERMISSION_DENIED
            message: '시스템 설정 > 개인정보 보호 및 보안 > 자동화 에서 Music 접근을 허용해 주세요'
            hint: 'open x-apple.systempreferences:com.apple.preference.security?Privacy_Automation'
    NotFound:
      description: 대상을 찾을 수 없다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: '세션 91 을 찾을 수 없습니다'
    Conflict:
      description: 현재 상태에서 수행할 수 없다 (E3, E6, E8)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: TURN_ALREADY_RUNNING
            message: '이미 진행 중인 요청이 있습니다'
    UnprocessableEntity:
      description: 요청은 유효하나 결과를 만들 수 없다 (E5, E10)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NO_MATCHING_TRACKS
            message: '조건에 맞는 곡이 라이브러리에 없습니다'
            hint: '가사 없음 조건을 빼면 12곡이 나옵니다'
    BadGateway:
      description: 외부 시스템 응답 실패 (E4, E7)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CATALOG_UNAVAILABLE
            message: 'Apple Music 카탈로그에 접근할 수 없습니다'
    ServiceUnavailable:
      description: Music.app 을 사용할 수 없다 (E2)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: MUSIC_APP_NOT_RUNNING
            message: 'Music 앱이 실행되어 있지 않습니다'

  schemas:

    # ---------------- 공통 ----------------
    ErrorCode:
      type: string
      description: 화면 예외 E1~E10 에 대응한다
      enum:
        - VALIDATION_FAILED
        - NOT_FOUND
        - AUTOMATION_PERMISSION_DENIED
        - MICROPHONE_PERMISSION_DENIED
        - MUSIC_APP_NOT_RUNNING
        - SYNC_IN_PROGRESS
        - TURN_ALREADY_RUNNING
        - TRACK_NOT_AVAILABLE_LOCALLY
        - NO_MATCHING_TRACKS
        - NO_MATCH_FOUND
        - MODEL_UNAVAILABLE
        - CATALOG_UNAVAILABLE

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 사용자에게 그대로 보여줄 수 있는 문장
        hint:
          type: string
          nullable: true
          description: 조치 안내. 화면 하단에 함께 표시된다

    PageMeta:
      type: object
      required: [hasMore]
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true

    # ---------------- 음악 ----------------
    Artist:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Album:
      type: object
      required: [id, title, artist]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        artist:
          $ref: '#/components/schemas/Artist'
        releaseYear:
          type: integer
          nullable: true
        artworkUrl:
          type: string
          format: uri
          nullable: true

    Tag:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 새벽
        kind:
          type: string
          enum: [mood, context, energy]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 해당 곡에 부여된 신뢰도 (L1 산출)

    TrackSource:
      type: string
      enum: [file, shared]
      description: '`shared` 는 Apple Music 스트리밍. 실측 라이브러리의 97%'

    Track:
      type: object
      required:
        [id, title, artist, durationMs, source, playCount, skipCount,
         favorited, disliked, excluded, addedAt]
      properties:
        id:
          type: integer
          format: int64
        persistentId:
          type: string
          description: Music.app 동기화 키
        appleMusicId:
          type: string
          nullable: true
        isrc:
          type: string
          nullable: true
        title:
          type: string
        artist:
          $ref: '#/components/schemas/Artist'
        album:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Album'
        genre:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        durationMs:
          type: integer
        source:
          $ref: '#/components/schemas/TrackSource'
        cloudStatus:
          type: string
          nullable: true
          example: subscription
        playCount:
          type: integer
        lastPlayedAt:
          type: string
          format: date-time
          nullable: true
          description: '★ `null` 이면 **담아두고 한 번도 재생하지 않은 곡**이다. 묘비의 1차 기준'
        skipCount:
          type: integer
        lastSkippedAt:
          type: string
          format: date-time
          nullable: true
        favorited:
          type: boolean
        disliked:
          type: boolean
        rating:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        addedAt:
          type: string
          format: date-time
        excluded:
          type: boolean
          description: 묘비에서 정리 표시된 곡. 큐 후보에서 제외된다
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    UpdateTrackRequest:
      type: object
      description: 묘비 화면의 "정리" — 제외 표시만 바꾼다. 곡을 삭제하지 않는다
      properties:
        excluded:
          type: boolean

    CatalogTrack:
      type: object
      description: Apple Music 카탈로그의 곡. 아직 라이브러리에 없을 수 있다
      required: [appleMusicId, title, artistName]
      properties:
        appleMusicId:
          type: string
        isrc:
          type: string
          nullable: true
        title:
          type: string
        artistName:
          type: string
        albumName:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        genre:
          type: string
          nullable: true
        artworkUrl:
          type: string
          format: uri
          nullable: true
        inLibrary:
          type: boolean
          description: 이미 라이브러리에 있는지 여부

    # ---------------- 세션 ----------------
    SessionStatus:
      type: string
      enum: [active, ended]

    SessionSummary:
      type: object
      required: [id, title, status, startedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: 최초 요청에서 생성. S1 헤더에 표시된다
        status:
          $ref: '#/components/schemas/SessionStatus'
        trackCount:
          type: integer
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

    Session:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required: [prompt, usage]
          properties:
            prompt:
              type: string
              description: 최초 자연어 입력 원문
            usage:
              $ref: '#/components/schemas/Usage'
            queueItems:
              type: array
              items:
                $ref: '#/components/schemas/QueueItem'
            summary:
              $ref: '#/components/schemas/QueueSummary'

    Usage:
      type: object
      description: S1 상태줄에 표시되는 누적 사용량
      required: [promptTokens, completionTokens, costUsd]
      properties:
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        costUsd:
          type: number
          format: double

    TurnStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    TurnIntent:
      type: string
      description: L2 가 분류한 의도
      enum: [generate_queue, refine_queue, explain, react, unknown]

    Turn:
      type: object
      required: [id, sessionId, prompt, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        prompt:
          type: string
        intent:
          type: string
          nullable: true
          description: 분류 전에는 `null`
          allOf:
            - $ref: '#/components/schemas/TurnIntent'
        status:
          $ref: '#/components/schemas/TurnStatus'
        assistantMessage:
          type: string
          nullable: true
          description: 사용자에게 보여줄 응답 문장
        queueItems:
          type: array
          nullable: true
          description: '`succeeded` 일 때 생성·변경된 큐 항목'
          items:
            $ref: '#/components/schemas/QueueItem'
        usage:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Usage'
        error:
          type: object
          nullable: true
          description: '`failed` 일 때의 사유. 이 경우에도 기존 큐의 재생은 계속된다'
          allOf:
            - $ref: '#/components/schemas/Error'
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    CreateSessionRequest:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 500
          description: 함께 보내면 첫 턴을 즉시 시작한다
          example: 새벽 코딩용, 가사 없는 걸로
        title:
          type: string
          maxLength: 200

    UpdateSessionRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SessionStatus'
        title:
          type: string
          maxLength: 200

    CreateTurnRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 500
          example: 좀 더 조용한 걸로
        mentionedArtistIds:
          type: array
          description: '`@` 멘션으로 후보를 좁힌 경우'
          items:
            type: integer
            format: int64
        mentionedTrackIds:
          type: array
          items:
            type: integer
            format: int64

    # ---------------- 큐 ----------------
    QueueItemState:
      type: string
      enum: [pending, playing, played, skipped, removed]

    QueueItemOrigin:
      type: string
      enum: [generation, revive, recognition, manual]

    QueueItem:
      type: object
      required: [id, sessionId, position, state, origin, track]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        position:
          type: integer
        track:
          $ref: '#/components/schemas/Track'
        reason:
          type: string
          nullable: true
          description: '★ F2 선정 근거 한 줄. L4 실패 시 `null` 이며 재생은 계속된다'
          example: 담아둔 뒤 한 번도 재생한 적 없고, 가사가 없습니다
        state:
          $ref: '#/components/schemas/QueueItemState'
        origin:
          $ref: '#/components/schemas/QueueItemOrigin'
        createdAt:
          type: string
          format: date-time

    QueueSummary:
      type: object
      description: S1 상태줄의 큐 요약
      required: [trackCount, totalDurationMs, neverPlayedCount]
      properties:
        trackCount:
          type: integer
        totalDurationMs:
          type: integer
        neverPlayedCount:
          type: integer
          description: 큐 안에서 `lastPlayedAt` 이 `null` 인 곡 수

    CreateQueueItemRequest:
      type: object
      required: [trackId]
      properties:
        trackId:
          type: integer
          format: int64
        position:
          type: integer
          minimum: 0
          description: 생략하면 큐 끝에 붙인다
        origin:
          $ref: '#/components/schemas/QueueItemOrigin'

    UpdateQueueItemRequest:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/QueueItemState'
        position:
          type: integer
          minimum: 0

    # ---------------- 반응 ----------------
    ReactionType:
      type: string
      enum:
        - skip_early
        - skip_mid
        - complete
        - repeat
        - favorite
        - dislike
        - explicit_positive
        - explicit_negative

    ReactionDetector:
      type: string
      enum: [poll, user]
      description: '`poll` 은 재생 위치 폴링이 관찰한 것 (기본)'

    Reaction:
      type: object
      required: [id, queueItemId, type, detectedBy, createdAt]
      properties:
        id:
          type: integer
          format: int64
        queueItemId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/ReactionType'
        detectedBy:
          $ref: '#/components/schemas/ReactionDetector'
        positionSec:
          type: number
          format: float
          nullable: true
          description: 이탈 시점. `skip_early` 판정 근거
        createdAt:
          type: string
          format: date-time

    CreateReactionRequest:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ReactionType'
        detectedBy:
          $ref: '#/components/schemas/ReactionDetector'
        positionSec:
          type: number
          format: float
          minimum: 0

    # ---------------- 취향 규칙 ----------------
    TasteRule:
      type: object
      required: [id, statement, condition, evidenceCount, active, derivedAt]
      properties:
        id:
          type: integer
          format: int64
        statement:
          type: string
          example: 새벽 시간대에 가사 있는 곡을 회피
        condition:
          type: object
          additionalProperties: true
          description: L3 선곡이 소비하는 구조화 조건
        evidenceCount:
          type: integer
          description: 근거가 된 반응 수. S4 에 함께 표시된다
        active:
          type: boolean
        derivedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateTasteRuleRequest:
      type: object
      properties:
        statement:
          type: string
          maxLength: 300
        active:
          type: boolean

    # ---------------- 플레이리스트 ----------------
    Playlist:
      type: object
      required: [id, name, trackCount, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        appleMusicPlaylistId:
          type: string
          nullable: true
          description: Music.app 반영 실패 시 `null` 로 남는다
        sourceSessionId:
          type: integer
          format: int64
          nullable: true
        trackCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreatePlaylistRequest:
      type: object
      required: [name, sessionId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        sessionId:
          type: integer
          format: int64
          description: 이 세션의 큐를 그대로 저장한다

    # ---------------- 인식 ----------------
    Recognition:
      type: object
      required: [id, shazamId, title, artistName, recognizedAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
          nullable: true
        shazamId:
          type: string
        appleMusicId:
          type: string
          nullable: true
        isrc:
          type: string
          nullable: true
        title:
          type: string
        artistName:
          type: string
        year:
          type: integer
          nullable: true
        genre:
          type: string
          nullable: true
        artworkUrl:
          type: string
          format: uri
          nullable: true
        matchedTrack:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Track'
          description: |
            ★ F11. `null` 이면 라이브러리에 없는 곡이다.
            채워져 있고 그 곡의 `lastPlayedAt` 이 `null` 이면
            **담아두고 한 번도 듣지 않은 곡**이다.
        recognizedAt:
          type: string
          format: date-time

    CreateRecognitionRequest:
      type: object
      description: ShazamKit 헬퍼가 반환한 `SHMediaItem` 을 그대로 옮긴다
      required: [shazamId, title, artistName]
      properties:
        shazamId:
          type: string
        appleMusicId:
          type: string
        isrc:
          type: string
        title:
          type: string
        artistName:
          type: string
        year:
          type: integer
        genre:
          type: string
        artworkUrl:
          type: string
          format: uri
        sessionId:
          type: integer
          format: int64

    AddLibraryTrackRequest:
      type: object
      required: [appleMusicId]
      properties:
        appleMusicId:
          type: string
        enqueueToSessionId:
          type: integer
          format: int64
          description: 지정하면 추가 후 곧바로 이 세션의 큐에 넣는다

    # ---------------- 동기화 · 진단 ----------------
    SyncStatus:
      type: string
      enum: [running, succeeded, failed]

    SyncRun:
      type: object
      required: [id, status, startedAt]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SyncStatus'
        trackCount:
          type: integer
          nullable: true
        taggedCount:
          type: integer
          nullable: true
          description: L1 무드 태깅이 완료된 곡 수
        error:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Error'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    LibraryDiagnosis:
      type: object
      description: S3 진단 화면. 서비스의 문제 정의를 사용자 데이터로 증명한다
      required:
        [totalTracks, neverPlayedCount, neverPlayedRatio,
         playedLast30DaysCount, playedLast365DaysCount]
      properties:
        totalTracks:
          type: integer
          example: 157
        neverPlayedCount:
          type: integer
          description: '`lastPlayedAt` 이 `null` 인 곡 수'
          example: 57
        neverPlayedRatio:
          type: number
          format: float
          description: 0.0 ~ 1.0
          example: 0.363
        playedLast30DaysCount:
          type: integer
          example: 52
        playedLast365DaysCount:
          type: integer
          example: 100
        oldestLastPlayedAt:
          type: string
          format: date-time
          nullable: true
          description: 전곡이 미재생이면 `null`
        sharedTrackCount:
          type: integer
          description: Apple Music 스트리밍 곡 수
        fileTrackCount:
          type: integer
          description: 로컬 파일 곡 수
        untaggedCount:
          type: integer
          description: L1 태깅이 아직 안 된 곡 수
        lastSync:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SyncRun'
