openapi: 3.0.3

info:
  title: Apple Music API
  version: 2.0.0
  license:
    name: UNLICENSED
    url: https://choosealicense.com/no-permission/
  description: |
    터미널에서 쓰는 Apple Music 클라이언트의 서버 API.

    화면(TUI)과 서버를 쪼갠 구조다. **Music.app 을 만지는 것은 서버뿐이고**,
    화면은 이 API 만 부른다. 그래서 AppleScript 권한·토큰·AI 키가 전부
    서버 한 곳에 모이고, 화면은 무엇을 그릴지만 알면 된다.

    ## 설계 원칙

    1. **자연어 요청은 비동기다.** `POST /turns` 는 `202` 를 돌려주고,
       화면은 `GET /turns/{turnId}` 로 진행을 본다. 선곡은 초 단위라
       입력창을 막으면 안 된다.
    2. **실시간 값은 저장하지 않는다.** 재생 위치·섞기·반복은 서버가
       Music.app 에 그때그때 물어 `GET /playback` 으로 돌려준다.
       우리가 켠 것을 기억하지 않고 매번 읽는 이유는, 사용자가 Music.app
       에서 직접 켤 수도 있기 때문이다.
    3. **관문은 로그인이 아니라 권한이다.** 그래서 `401` 이 없다.
       대신 `403 AUTOMATION_PERMISSION_DENIED` 와
       `503 MUSIC_APP_NOT_RUNNING` 이 있다.
    4. **AI 실패는 재생을 막지 않는다.** 선정 근거를 못 만들면
       `reason` 이 `null` 일 뿐 큐는 그대로 돈다.

    ## 화면 ↔ API

    | 화면 | 부르는 API |
    |---|---|
    | S1 홈 | `GET /status` |
    | S2·S3 지금 재생 | `GET /playback` · `GET /playback/lyrics` |
    | S4 목록 — Recently Added | `GET /tracks?sort=addedAt` |
    | S4 목록 — Songs | `GET /tracks?sort=title` |
    | S4 목록 — Unplayed | `GET /tracks?unplayed=true` |
    | S5 목록 — Artists · Albums | `GET /artists` · `GET /albums` |
    | S5 파고들기 | `GET /artists/{id}/tracks` · `GET /albums/{id}/tracks` |
    | S6 플레이리스트 | `GET /playlists` · `GET /playlists/{id}/tracks` |
    | S6 Queue | `GET /queue` · `POST /queue/items` · `PATCH`·`DELETE /queue/items/{id}` |
    | S6 Catalog | `GET /catalog/tracks?q=` · `POST /library/tracks` |
    | S7 로그 띠 | `GET /messages` · `POST /turns` · `GET /turns/{id}` |
    | S8 입력창 — Search | `GET /tracks?q=` |
    | S8 입력창 — 취소(esc) | `POST /turns/{id}/cancel` |
    | S9 상태줄 누적 비용 | `GET /turns/usage` |
    | S10 `/save` | `POST /playlists` |
    | S11 관문 | 모든 응답의 에러 코드 |
    | (화면 없음) 재생 종료 기록 | `POST /plays` |

    ## 화면 예외 ↔ 에러 코드

    | 화면이 하는 말 | HTTP | code |
    |---|---|---|
    | `PERMISSION` 자동화 권한을 허용해 주세요 | 403 | `AUTOMATION_PERMISSION_DENIED` |
    | `MUSIC APP` Music 이 실행되어 있지 않습니다 | 503 | `MUSIC_APP_NOT_RUNNING` |
    | `⟳ syncing` 이미 읽는 중입니다 | 409 | `SYNC_IN_PROGRESS` |
    | `AI is off · /ai <key>` | 409 | `AI_NOT_CONFIGURED` |
    | `/setup <team ID>` 카탈로그 설정이 없습니다 | 409 | `CATALOG_NOT_CONFIGURED` |
    | 카탈로그에 닿지 못했습니다 | 502 | `CATALOG_UNAVAILABLE` |
    | 모델이 답하지 않습니다 | 502 | `MODEL_UNAVAILABLE` |
    | 조건에 맞는 곡이 없습니다 | 422 | `NO_MATCHING_TRACKS` |
    | 이미 진행 중인 요청이 있습니다 | 409 | `TURN_ALREADY_RUNNING` |
    | 가사를 찾지 못했습니다 | 404 | `LYRICS_NOT_FOUND` |

    ## 범위 밖

    **Security Schemes 는 과제 명세에 따라 정의하지 않는다.**
    한 사람의 기기에서 도는 로컬 서버를 전제하므로 `401` 도 없다.

servers:
  - url: http://127.0.0.1:8787/v1
    description: 로컬 서버 — 이 기기 밖으로 나가지 않는다

tags:
  - name: status
    description: 무엇에 붙어 있고 무엇이 막혀 있는가 (S1 홈 · S11 관문)
  - name: library
    description: Music.app 스냅샷 — 곡 · 아티스트 · 앨범 · 플레이리스트 (S4·S5·S6)
  - name: catalog
    description: Apple Music 카탈로그 검색과 담기 (S6 Catalog)
  - name: playback
    description: 지금 재생 중인 것과 그 제어 (S2·S3)
  - name: queue
    description: 다음에 틀 것 (S6 Queue)
  - name: turns
    description: 자연어 요청과 그 대화 (S7·S8)
  - name: plays
    description: 곡이 끝난 사건 — 왜 끝났는지는 우리만 안다

paths:

  # ===================================================================
  #  status — S1 홈 · S11 관문
  # ===================================================================
  /status:
    get:
      tags: [status]
      summary: 무엇에 붙어 있고 무엇을 갖고 있는가
      description: |
        홈 화면(S1)이 통째로 이 응답으로 그려진다. 관문 사유도 여기 있다 —
        **이 호출만은 권한이 없어도 200 을 준다.** 막혀 있다는 사실 자체가
        화면이 그려야 할 내용이기 때문이다.
      operationId: getStatus
      responses:
        '200':
          description: 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /settings:
    get:
      tags: [status]
      summary: 설정 조회
      description: 비밀값은 돌려주지 않는다. "붙어 있는가"만 돌려준다.
      operationId: getSettings
      responses:
        '200':
          description: 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    patch:
      tags: [status]
      summary: 설정 변경
      description: |
        `/setup <team ID>` 와 `/ai <key>` 가 부른다. 보낸 필드만 바뀐다.
        키와 토큰은 서버가 macOS 키체인에 넣고 DB 에는 남기지 않는다.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: 바뀐 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400': { $ref: '#/components/responses/BadRequest' }

  # ===================================================================
  #  library — S4 · S5 · S6
  # ===================================================================
  /library/sync:
    get:
      tags: [library]
      summary: 동기화 상태
      description: 상태줄의 `⟳ syncing` 이 이 값을 본다.
      operationId: getSync
      responses:
        '200':
          description: 마지막 동기화
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sync'
    post:
      tags: [library]
      summary: Music.app 을 다시 읽는다
      description: |
        `/reload` 가 부른다. 1만 곡대에서 초 단위가 걸리므로 비동기다 —
        `202` 를 돌려주고 화면은 `GET /library/sync` 로 진행을 본다.
      operationId: startSync
      responses:
        '202':
          description: 읽기 시작함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sync'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /tracks:
    get:
      tags: [library]
      summary: 곡 목록
      description: |
        목록 패널의 세 구역이 이 하나를 파라미터만 바꿔 쓴다.

        | 구역 | 호출 |
        |---|---|
        | Recently Added | `?sort=addedAt&order=desc` |
        | Songs | `?sort=title` |
        | Unplayed | `?unplayed=true` |
        | 검색(ctrl+f) | `?q=<검색어>` |

        `inLibrary=false` 인 곡은 기본으로 빠진다 — 플레이리스트에만
        담고 라이브러리에는 없는 곡이 실제로 존재하기 때문이다.
      operationId: listTracks
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: unplayed
          in: query
          description: '`true` 면 한 번도 재생하지 않은 곡만 (`lastPlayedAt` 이 null)'
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema:
            type: string
            enum: [title, addedAt, lastPlayedAt, playCount]
            default: title
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 곡 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPage'
        '400': { $ref: '#/components/responses/BadRequest' }

  /tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [library]
      summary: 곡 하나
      operationId: getTrack
      responses:
        '200':
          description: 곡
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '404': { $ref: '#/components/responses/NotFound' }

  /artists:
    get:
      tags: [library]
      summary: 아티스트 묶음 목록
      description: 목록 패널의 Artists 구역(S5). 곡 수와 누적 재생 수를 부제로 쓴다.
      operationId: listArtists
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 아티스트 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistPage'
        '400': { $ref: '#/components/responses/BadRequest' }

  /artists/{artistId}/tracks:
    parameters:
      - $ref: '#/components/parameters/ArtistId'
    get:
      tags: [library]
      summary: 그 아티스트의 곡 — 파고들기
      operationId: listArtistTracks
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 곡 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPage'
        '404': { $ref: '#/components/responses/NotFound' }

  /albums:
    get:
      tags: [library]
      summary: 앨범 묶음 목록
      operationId: listAlbums
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 앨범 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumPage'
        '400': { $ref: '#/components/responses/BadRequest' }

  /albums/{albumId}/tracks:
    parameters:
      - $ref: '#/components/parameters/AlbumId'
    get:
      tags: [library]
      summary: 그 앨범의 곡 — 파고들기
      operationId: listAlbumTracks
      responses:
        '200':
          description: 곡 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPage'
        '404': { $ref: '#/components/responses/NotFound' }

  /playlists:
    get:
      tags: [library]
      summary: 플레이리스트 목록
      description: 곡이 0개인 것은 빠진다 — 화면이 빈 구역을 만들지 않기 때문이다.
      operationId: listPlaylists
      responses:
        '200':
          description: 플레이리스트 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Playlist'
    post:
      tags: [library]
      summary: 지금 큐를 플레이리스트로 저장
      description: '`/save <name>` 이 부른다. Music.app 에 실제로 만들어진다.'
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '201':
          description: 만들어진 플레이리스트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /playlists/{playlistId}/tracks:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [library]
      summary: 플레이리스트의 곡 — 담긴 순서대로
      operationId: listPlaylistTracks
      responses:
        '200':
          description: 곡 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPage'
        '404': { $ref: '#/components/responses/NotFound' }

  # ===================================================================
  #  catalog — S6 Catalog 구역
  # ===================================================================
  /catalog/tracks:
    get:
      tags: [catalog]
      summary: Apple Music 카탈로그 검색
      description: |
        설정이 없으면 화면에 구역 자체가 없다. 그래도 호출되면
        `409 CATALOG_NOT_CONFIGURED` 로 왜 없는지 말한다.

        응답의 `inLibrary` 가 화면의 `✓` / `+` 표시다.
      operationId: searchCatalog
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogTrack'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /library/tracks:
    post:
      tags: [catalog]
      summary: 카탈로그 곡을 내 라이브러리에 담는다
      description: 화면의 표시가 `+` → `⋯` → `✓` 로 바뀌는 그 동작이다.
      operationId: addCatalogTrack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appleMusicId]
              properties:
                appleMusicId:
                  type: string
      responses:
        '201':
          description: 담긴 곡
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===================================================================
  #  playback — S2 · S3
  # ===================================================================
  /playback:
    get:
      tags: [playback]
      summary: 지금 재생 중인 것
      description: |
        **전부 실시간이다.** 서버가 Music.app 에 물어 그대로 돌려준다.
        저장하지 않는 이유는 사용자가 Music.app 에서 직접 조작할 수 있기
        때문이다 — 우리가 기억한 값은 그 순간 거짓말이 된다.

        화면이 1초마다 부른다.
      operationId: getPlayback
      responses:
        '200':
          description: 재생 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playback'
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [playback]
      summary: 켜져 있는 것을 바꾼다
      description: '`/shuffle` · `/repeat` · `/volume` · `/love` · `/rate` 가 부른다.'
      operationId: updatePlayback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaybackRequest'
      responses:
        '200':
          description: 바뀐 재생 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playback'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /playback/play:
    post:
      tags: [playback]
      summary: 튼다
      description: |
        `trackId` 를 주면 그 곡부터, `queueItemId` 를 주면 큐의 그 자리부터,
        둘 다 없으면 멈춰 있던 것을 이어서 튼다. `enter` 의 뜻은 하나다.
      operationId: play
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayRequest'
      responses:
        '200':
          description: 재생 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playback'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /playback/pause:
    post:
      tags: [playback]
      summary: 멈춘다
      operationId: pause
      responses:
        '200':
          description: 재생 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playback'
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /playback/next:
    post:
      tags: [playback]
      summary: 다음 곡으로 넘긴다
      description: 넘긴 곡은 `POST /plays` 로 `skipped` 로 기록된다.
      operationId: next
      responses:
        '200':
          description: 재생 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playback'
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /playback/artwork:
    get:
      tags: [playback]
      summary: 지금 곡의 앨범 커버
      description: |
        화면 S2 의 왼쪽 절반이 이것이다. Music.app 이 바이너리로 준다.

        **저장하지 않는다** — 우리 것이 아니고, 라이브러리 1만 곡의
        커버를 들고 있을 이유도 없다. 곡이 바뀌면 다시 부른다.

        커버가 없는 곡이 있다. 그때는 `404` 이고, 화면은 그 자리를
        비운 채 나머지를 그린다.
      operationId: getArtwork
      responses:
        '200':
          description: 이미지 바이트
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /playback/lyrics:
    get:
      tags: [playback]
      summary: 지금 곡의 가사
      description: |
        LRCLIB 에서 받아 온다. **저장하지 않는다** — 우리 것이 아니고,
        같은 곡이라도 판본마다 타이밍이 다르다.

        없는 것이 정상이다. 없으면 화면은 그 자리에 곡 이력을 그린다.
      operationId: getLyrics
      responses:
        '200':
          description: 가사
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lyrics'
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===================================================================
  #  queue — S6 Queue 구역
  # ===================================================================
  /queue:
    get:
      tags: [queue]
      summary: 지금 큐
      operationId: getQueue
      responses:
        '200':
          description: 큐
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
    delete:
      tags: [queue]
      summary: 큐를 비운다
      description: '`/clear` 가 부른다. 빠진 곡들은 `removed` 로 기록된다.'
      operationId: clearQueue
      responses:
        '204':
          description: 비웠다
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /queue/items:
    post:
      tags: [queue]
      summary: 큐에 곡을 넣는다
      description: |
        `/next` 는 `position=next`, `/later` 는 `position=end` 로 부른다.
        **재생을 끊지 않는다** — 지금 곡은 그대로 간다.
      operationId: addQueueItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddQueueItemRequest'
      responses:
        '201':
          description: 넣은 항목
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /queue/items/{queueItemId}:
    parameters:
      - $ref: '#/components/parameters/QueueItemId'
    patch:
      tags: [queue]
      summary: 순서를 바꾼다
      description: '`/up` 과 `/down` 이 부른다. 뒤 항목들의 `position` 은 서버가 다시 매긴다.'
      operationId: moveQueueItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: 옮긴 뒤의 큐
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [queue]
      summary: 큐에서 뺀다
      description: '`/remove` 가 부른다. 지금 재생 중인 항목은 뺄 수 없다 — `409`.'
      operationId: removeQueueItem
      responses:
        '204':
          description: 뺐다
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ===================================================================
  #  turns — S7 로그 띠 · S8 입력창
  # ===================================================================
  /turns:
    post:
      tags: [turns]
      summary: 자연어 요청을 낸다
      description: |
        입력창에 친 문장이 여기로 온다. **`202` 를 즉시 돌려준다** —
        선곡은 실측 7초라 기다리게 하면 입력창이 그동안 죽는다.

        화면은 로그 띠에 스피너를 띄우고 `GET /turns/{turnId}` 를 폴링한다.

        `intent` 를 주지 않으면 서버가 문장을 보고 정한다 — 새 큐를 짤지,
        지금 큐에 덧붙일지.
      operationId: createTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTurnRequest'
      responses:
        '202':
          description: 요청을 받았다. 아직 답은 없다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /turns/usage:
    get:
      tags: [turns]
      summary: 이 기기가 지금까지 쓴 것
      description: |
        상태줄 오른쪽 끝(S9)과 `/cost`(S10)가 본다.
        `turn` 을 합친 값이다 — 따로 저장하지 않는다.
      operationId: getUsage
      responses:
        '200':
          description: 누적 사용량
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'

  /turns/{turnId}:
    parameters:
      - $ref: '#/components/parameters/TurnId'
    get:
      tags: [turns]
      summary: 요청 하나의 진행과 결과
      description: |
        `status` 가 `running` 이면 아직이다. `done` 이면 `usage` 와
        `picks` 가 채워져 있고, 그것이 대화 띠에 답과 함께 그려지는
        내용(S7)이다.
      operationId: getTurn
      responses:
        '200':
          description: 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '404': { $ref: '#/components/responses/NotFound' }

  /turns/{turnId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TurnId'
    post:
      tags: [turns]
      summary: 진행 중인 요청을 물린다
      description: |
        `esc` 사슬의 첫 칸이다. 선곡이 7초 걸리는 동안 잘못 물어본 것을
        알아채는데, 물러날 방법이 없으면 끝날 때까지 봐야 한다.

        이미 끝난 요청에 부르면 `409`.
      operationId: cancelTurn
      responses:
        '200':
          description: 물린 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /messages:
    get:
      tags: [turns]
      summary: 로그 띠에 그릴 줄들
      description: 최근 것이 아래다. 사람이 친 말과 앱이 한 말이 한 흐름으로 섞인다.
      operationId: listMessages
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 로그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400': { $ref: '#/components/responses/BadRequest' }

  # ===================================================================
  #  plays — 화면에 없지만 남겨야 하는 것
  # ===================================================================
  /plays:
    post:
      tags: [plays]
      summary: 곡 하나가 끝났다
      description: |
        화면이 재생을 지켜보다가 곡이 끝나는 순간 부른다.

        Music.app 의 재생 횟수·스킵 횟수에는 넷이 뒤섞여 있어서 **왜**
        끝났는지를 알 수 없다. 사용자가 넘긴 것, 큐에서 뺀 것, 큐를
        갈아끼운 것, 끝까지 들은 것. 그것을 여기서 나눈다.

        이 기록은 화면 어디에도 안 보인다. 대신 다음 선곡(`POST /turns`)이
        읽어서, "이 사람이 최근에 넘긴 곡"을 후보에서 덜어낸다.
      operationId: recordPlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPlayRequest'
      responses:
        '201':
          description: 적었다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Play'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

# =====================================================================
#  components
# =====================================================================
components:

  parameters:
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ArtistId:
      name: artistId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    QueueItemId:
      name: queueItemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TurnId:
      name: turnId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Query:
      name: q
      in: query
      description: 검색어. 제목과 아티스트를 본다. 비면 필터를 풀지 않은 것이다
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      description: 한 번에 받을 개수
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: 이전 응답의 `nextCursor`
      schema: { type: string }

  responses:
    BadRequest:
      description: 요청 형식이 잘못되었다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: VALIDATION_FAILED
            message: 'position 은 0 이상이어야 합니다'
    Forbidden:
      description: macOS 자동화 권한이 거부되었다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: AUTOMATION_PERMISSION_DENIED
            message: 'Allow Terminal to control Music, then it just works'
            hint: '시스템 설정 › 개인정보 보호 및 보안 › 자동화'
    NotFound:
      description: 대상을 찾을 수 없다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: NOT_FOUND
            message: '곡 4821 을 찾을 수 없습니다'
    Conflict:
      description: 지금 상태에서는 할 수 없다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: AI_NOT_CONFIGURED
            message: 'AI is off'
            hint: '/ai <key> 로 켤 수 있습니다'
    BadGateway:
      description: 바깥이 답하지 않는다 — 카탈로그 · 모델 · 가사
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: CATALOG_UNAVAILABLE
            message: 'Apple Music 카탈로그에 닿지 못했습니다'
    ServiceUnavailable:
      description: Music.app 이 실행되어 있지 않다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: MUSIC_APP_NOT_RUNNING
            message: 'Music is not running. Open it to start playback'
            hint: 'open -a Music'

  schemas:

    # ---------------- 공통 ----------------
    ErrorCode:
      type: string
      description: 화면(S11)이 하는 말에 하나씩 대응한다
      enum:
        - VALIDATION_FAILED
        - NOT_FOUND
        - AUTOMATION_PERMISSION_DENIED
        - MUSIC_APP_NOT_RUNNING
        - SYNC_IN_PROGRESS
        - AI_NOT_CONFIGURED
        - CATALOG_NOT_CONFIGURED
        - CATALOG_UNAVAILABLE
        - MODEL_UNAVAILABLE
        - NO_MATCHING_TRACKS
        - TURN_ALREADY_RUNNING
        - TRACK_NOT_AVAILABLE
        - LYRICS_NOT_FOUND

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 화면에 그대로 띄울 수 있는 문장
        hint:
          type: string
          nullable: true
          description: 무엇을 하면 되는지. 왜 안 되는지가 아니다

    PageMeta:
      type: object
      required: [hasMore]
      properties:
        hasMore: { type: boolean }
        nextCursor:
          type: string
          nullable: true

    # ---------------- 라이브러리 ----------------
    Artist:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    Album:
      type: object
      required: [id, title, artist]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        artist: { $ref: '#/components/schemas/Artist' }

    Track:
      type: object
      description: '`track` 표 그대로다. 화면 S2·S4 가 이 필드들을 그린다'
      required: [id, title, artist, durationMs, playCount, inLibrary]
      properties:
        id: { type: integer, format: int64 }
        title:
          type: string
          description: S2·S4 제목
        artist: { $ref: '#/components/schemas/Artist' }
        album:
          type: object
          allOf: [{ $ref: '#/components/schemas/Album' }]
          nullable: true
          description: 앨범 없는 곡이 있다
        genre:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        durationMs:
          type: integer
          description: S2·S4 길이
        playCount:
          type: integer
          description: S2·S4 재생 횟수
        addedAt:
          type: string
          format: date-time
          nullable: true
          description: 담은 적이 없으면 null
        lastPlayedAt:
          type: string
          format: date-time
          nullable: true
          description: '★ null 이면 담아두고 한 번도 재생하지 않은 곡. `Unplayed` 구역과 `never played` 경고가 이 값 하나에 걸려 있다'
        inLibrary:
          type: boolean
          description: 플레이리스트에만 담긴 곡은 false
        appleMusicId:
          type: string
          nullable: true

    TrackPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Track' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ArtistSummary:
      type: object
      description: 목록 패널의 묶음 행(S5). 부제로 곡 수와 누적 재생 수를 쓴다
      required: [id, name, trackCount, playCount]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        trackCount: { type: integer }
        playCount: { type: integer }

    ArtistPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArtistSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    AlbumSummary:
      type: object
      required: [id, title, artist, trackCount, playCount]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        artist: { $ref: '#/components/schemas/Artist' }
        trackCount: { type: integer }
        playCount: { type: integer }

    AlbumPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AlbumSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    Playlist:
      type: object
      required: [id, name, trackCount]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        trackCount: { type: integer }

    CreatePlaylistRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        fromQueue:
          type: boolean
          default: true
          description: 지금 큐를 그대로 담는다
        trackIds:
          type: array
          description: '`fromQueue` 가 false 일 때 직접 지정한다'
          items: { type: integer, format: int64 }

    CatalogTrack:
      type: object
      description: 카탈로그 검색 결과(S6). 아직 내 것이 아닐 수 있다
      required: [appleMusicId, title, artistName, durationMs, inLibrary]
      properties:
        appleMusicId: { type: string }
        title: { type: string }
        artistName: { type: string }
        albumTitle:
          type: string
          nullable: true
        durationMs: { type: integer }
        inLibrary:
          type: boolean
          description: 화면의 `✓` / `+` 표시가 이 값이다
        trackId:
          type: integer
          format: int64
          nullable: true
          description: 담겨 있으면 우리 쪽 id

    Sync:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [idle, running, failed]
        trackCount:
          type: integer
          nullable: true
        playlistCount:
          type: integer
          nullable: true
        syncedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true

    # ---------------- 재생 ----------------
    Repeat:
      type: string
      enum: [off, one, all]

    Playback:
      type: object
      description: '**전부 실시간이다.** 저장되는 값이 하나도 없다'
      required: [playing, shuffle, repeat]
      properties:
        playing: { type: boolean }
        track:
          type: object
          allOf: [{ $ref: '#/components/schemas/Track' }]
          nullable: true
          description: 라이브러리에 없는 곡(카탈로그 스트리밍)도 여기로 온다
        positionMs:
          type: integer
          nullable: true
        durationMs:
          type: integer
          nullable: true
        shuffle: { type: boolean }
        repeat: { $ref: '#/components/schemas/Repeat' }
        favorited:
          type: boolean
          nullable: true
        volume:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        queueItemId:
          type: integer
          format: int64
          nullable: true
          description: 큐에서 튼 곡이면 그 항목

    UpdatePlaybackRequest:
      type: object
      description: 보낸 것만 바뀐다. 전부 선택이다
      minProperties: 1
      properties:
        shuffle: { type: boolean }
        repeat: { $ref: '#/components/schemas/Repeat' }
        volume: { type: integer, minimum: 0, maximum: 100 }
        favorited: { type: boolean }
        rating: { type: integer, minimum: 0, maximum: 5 }

    PlayRequest:
      type: object
      description: 셋 중 하나. 아무것도 안 주면 이어서 튼다
      properties:
        trackId: { type: integer, format: int64 }
        queueItemId: { type: integer, format: int64 }

    LyricLine:
      type: object
      required: [atMs, text]
      properties:
        atMs:
          type: integer
          description: 이 줄이 시작하는 시각. 화면이 이걸로 현재 줄을 고른다
        text: { type: string }

    Lyrics:
      type: object
      required: [source, lines]
      properties:
        source:
          type: string
          example: LRCLIB
        synced:
          type: boolean
          description: false 면 시간 정보 없는 통짜 가사다
        lines:
          type: array
          items: { $ref: '#/components/schemas/LyricLine' }

    # ---------------- 큐 ----------------
    QueueItemOrigin:
      type: string
      enum: [user, ai]
      description: 사람이 넣었나 AI 가 넣었나

    QueueItemState:
      type: string
      enum: [pending, playing, played, skipped, removed]

    QueueItem:
      type: object
      required: [id, position, track, origin, state]
      properties:
        id: { type: integer, format: int64 }
        position:
          type: integer
          description: S6 큐 순번
        track: { $ref: '#/components/schemas/Track' }
        reason:
          type: string
          nullable: true
          description: '★ AI 가 이 곡을 왜 골랐는지 한 줄. 대화 띠에 답과 함께 그대로 보인다(S7). 못 만들면 null 이고 재생은 그대로 간다'
          example: 담아둔 뒤 한 번도 재생한 적이 없습니다
        origin: { $ref: '#/components/schemas/QueueItemOrigin' }
        state: { $ref: '#/components/schemas/QueueItemState' }
        turnId:
          type: integer
          format: int64
          nullable: true

    Queue:
      type: object
      required: [id, items, trackCount, totalDurationMs]
      properties:
        id: { type: integer, format: int64 }
        title:
          type: string
          nullable: true
          description: S9 상태줄에 뜬다
        items:
          type: array
          items: { $ref: '#/components/schemas/QueueItem' }
        trackCount: { type: integer }
        totalDurationMs: { type: integer }
        createdAt: { type: string, format: date-time }

    AddQueueItemRequest:
      type: object
      required: [trackId]
      properties:
        trackId: { type: integer, format: int64 }
        position:
          oneOf:
            - type: string
              enum: [next, end]
            - type: integer
              minimum: 0
          default: end
          description: '`next` 는 지금 곡 바로 뒤, `end` 는 맨 뒤'

    # ---------------- 대화 ----------------
    TurnStatus:
      type: string
      enum: [running, done, failed, canceled]

    TurnIntent:
      type: string
      enum: [create, append]
      description: 새 큐를 짤지 지금 큐에 덧붙일지. 안 주면 서버가 문장을 보고 정한다

    Usage:
      type: object
      required: [promptTokens, completionTokens, costUsd]
      properties:
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        costUsd:
          type: number
          format: double
          description: S9 상태줄 오른쪽 끝에 붙박이로 앉는다

    Turn:
      type: object
      required: [id, prompt, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        prompt: { type: string }
        status: { $ref: '#/components/schemas/TurnStatus' }
        intent:
          type: string
          allOf: [{ $ref: '#/components/schemas/TurnIntent' }]
          nullable: true
        message:
          type: string
          nullable: true
          description: 로그 띠에 한 줄로 뜨는 답
        model:
          type: string
          nullable: true
          description: S7 상세 — 어느 모델이 답했나
        candidateCount:
          type: integer
          nullable: true
          description: S7 상세 — 후보 몇 곡에서 골랐나
        elapsedMs:
          type: integer
          nullable: true
        usage:
          type: object
          allOf: [{ $ref: '#/components/schemas/Usage' }]
          nullable: true
        picks:
          type: array
          nullable: true
          description: 이 요청이 큐에 넣은 항목들. 곡별 근거가 여기 있다
          items: { $ref: '#/components/schemas/QueueItem' }
        errorCode:
          type: string
          allOf: [{ $ref: '#/components/schemas/ErrorCode' }]
          nullable: true
          description: |
            선곡이 실패한 이유. **HTTP 상태가 아니라 잡의 상태로 온다** —
            요청 자체는 이미 202 로 받았기 때문이다.
            `NO_MATCHING_TRACKS` · `MODEL_UNAVAILABLE` 이 여기로 온다
        errorMessage:
          type: string
          nullable: true
        createdAt: { type: string, format: date-time }

    CreateTurnRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 500
          description: 입력창 글자 수 제한과 같다
        intent:
          $ref: '#/components/schemas/TurnIntent'

    MessageRole:
      type: string
      enum: [user, assistant]

    Message:
      type: object
      required: [id, role, text, isError, createdAt]
      properties:
        id: { type: integer, format: int64 }
        turnId:
          type: integer
          format: int64
          nullable: true
        role: { $ref: '#/components/schemas/MessageRole' }
        text: { type: string }
        isError:
          type: boolean
          description: 실패도 대화의 일부다
        createdAt: { type: string, format: date-time }

    MessagePage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ---------------- 재생 사건 ----------------
    EndedBy:
      type: string
      enum: [finished, skipped, removed, replaced]
      description: 무엇이 이 곡을 끝냈나. 이 기록의 존재 이유다

    RecordPlayRequest:
      type: object
      required: [trackId, playedMs, durationMs, endedBy, shuffle]
      properties:
        trackId: { type: integer, format: int64 }
        queueItemId:
          type: integer
          format: int64
          nullable: true
        playedMs:
          type: integer
          description: 몇 ms 듣고 나갔나
        durationMs:
          type: integer
          description: 그때의 곡 길이. 판본이 바뀌어도 그날의 셈이 틀어지면 안 된다
        endedBy: { $ref: '#/components/schemas/EndedBy' }
        shuffle: { type: boolean }

    Play:
      allOf:
        - $ref: '#/components/schemas/RecordPlayRequest'
        - type: object
          required: [id, playedAt]
          properties:
            id: { type: integer, format: int64 }
            playedAt: { type: string, format: date-time }

    # ---------------- 상태 ----------------
    Status:
      type: object
      description: 홈 화면(S1)이 통째로 이것으로 그려진다
      required: [version, music, catalog, ai, library]
      properties:
        version: { type: string }
        music:
          type: object
          required: [running, permission]
          properties:
            running: { type: boolean }
            permission:
              type: string
              enum: [granted, denied, unknown]
        catalog:
          type: object
          required: [configured, signedIn]
          properties:
            configured:
              type: boolean
              description: '`/setup <team ID>` 를 했나'
            signedIn:
              type: boolean
              description: '`/login` 을 했나'
        ai:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            provider:
              type: string
              nullable: true
              description: 네 돈이 어디로 가는지는 밝혀야 한다
            model:
              type: string
              nullable: true
        library:
          type: object
          required: [trackCount, playlistCount]
          properties:
            trackCount: { type: integer }
            playlistCount: { type: integer }
            syncedAt:
              type: string
              format: date-time
              nullable: true

    Settings:
      type: object
      description: 비밀값은 없다. "붙어 있는가"만 있다
      required: [catalogConfigured, catalogSignedIn, aiEnabled]
      properties:
        appleTeamId:
          type: string
          nullable: true
        catalogConfigured: { type: boolean }
        catalogSignedIn: { type: boolean }
        aiEnabled: { type: boolean }
        aiProvider:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    UpdateSettingsRequest:
      type: object
      description: 보낸 것만 바뀐다
      minProperties: 1
      properties:
        appleTeamId:
          type: string
          description: '`/setup <team ID>`'
        appleUserToken:
          type: string
          description: '`/login` 이 브라우저에서 받아 온 MusicKit 사용자 토큰'
        aiApiKey:
          type: string
          description: '`/ai <key>`. 서버가 키체인에 넣고 DB 에는 남기지 않는다'
        aiProvider:
          type: string
