openapi: 3.0.3

info:
  title: Relay API
  version: 1.0.0
  description: |
    개발팀의 GitHub 정보를 세일즈·PM이 고객 앞에서 바로 말할 수 있는 문장으로
    바꿔 실시간 제공하는 어시스턴트의 REST API.

    **설계 근거 문서**
    - 화면·필드 명세: `docs/05-화면-필드.md`
    - 데이터 모델: `판교_3반_Relay-DB.dbml`

    **정합성 규칙**
    - 화면 필드 명세의 `시점 = 요청` 항목마다 엔드포인트가 1:1로 존재한다
    - 모든 응답 스키마 필드는 ERD 컬럼 또는 명세의 `출처 = 계산` 항목이다

    **인증**
    과제 평가 기준의 Security Schemes 제외 항목에 따라 정의하지 않는다.
  contact:
    name: 판교 3반 / Relay

servers:
  - url: https://api.relay.example.com/v1
    description: 운영
  - url: http://localhost:3000/v1
    description: 로컬

tags:
  - name: sessions
    description: 대화 세션. 화면 1-① 세션 헤더
  - name: utterances
    description: 발화 기록. 화면 1-④ 전사 스트림
  - name: questions
    description: 감지된 질문과 판정. 화면 1-② 판정 카드, 1-③ 히스토리
  - name: deferrals
    description: 지식 공백. 화면 2 지식 공백 큐
  - name: policy-rules
    description: 답변 규칙. 화면 3-② 만료 알림, 3-③ 규칙 리스트
  - name: knowledge
    description: 지식 소스. 화면 3-④ 소스 관리
  - name: metrics
    description: 커버리지 지표. 화면 3-① 대시보드

# =========================================================
paths:
# =========================================================

  # ---------- sessions ----------
  /sessions:
    post:
      tags: [sessions]
      summary: 세션 생성
      description: 화면 1-① — 미팅 시작. 상대 조직과 도메인별 컨텍스트를 받는다.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreate' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }

    get:
      tags: [sessions]
      summary: 세션 목록
      operationId: listSessions
      parameters:
        - $ref: '#/components/parameters/DomainFilter'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SessionStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Session' }

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      summary: 세션 조회
      description: 화면 1-① 초기 로드. 참가자 목록을 함께 반환한다.
      operationId: getSession
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{sessionId}/context:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      tags: [sessions]
      summary: 세션 컨텍스트 갱신
      description: |
        화면 1-① [컨텍스트] 버튼. 대화 중 NDA 체결 등 상황 변화를 반영한다.
        갱신 즉시 이후 검색의 `audience_level` 필터에 적용된다.
      operationId: updateSessionContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context]
              properties:
                context: { $ref: '#/components/schemas/SessionContext' }
      responses:
        '200':
          description: 갱신됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 종료된 세션은 수정할 수 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{sessionId}/end:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      summary: 세션 종료
      description: |
        화면 1-① [종료] 버튼.
        세션 내 미해소 `knowledge_gap`이 검토 큐로 확정된다.
      operationId: endSession
      responses:
        '200':
          description: 종료됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Session'
                  - type: object
                    properties:
                      confirmed_gap_count:
                        type: integer
                        description: 큐로 확정된 공백 수
                        example: 3
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 종료된 세션
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------- utterances ----------
  /sessions/{sessionId}/utterances:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [utterances]
      summary: 발화 목록
      description: 화면 1-④ 전사 스트림. 재접속 시 이력 복원에 사용한다.
      operationId: listUtterances
      parameters:
        - name: since
          in: query
          description: 이 시각 이후 발화만
          schema: { type: string, format: date-time }
        - name: role
          in: query
          description: 화자 역할 필터
          schema: { $ref: '#/components/schemas/ParticipantRole' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Utterance' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [utterances]
      summary: 발화 기록
      description: |
        STT 파이프라인이 호출한다. 최종 확정 발화만 저장된다.
        `role != host` 이면 질문 감지 파이프라인이 이어서 실행된다.
      operationId: createUtterance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UtteranceCreate' }
      responses:
        '201':
          description: 기록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utterance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{sessionId}/stream:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [utterances]
      summary: 실시간 스트림 (WebSocket 업그레이드)
      description: |
        화면 1-②③④의 실시간 푸시 채널.
        `Upgrade: websocket` 헤더로 호출하며, 서버는 아래 이벤트를 푸시한다.

        | 이벤트 | 페이로드 | 화면 |
        |---|---|---|
        | `utterance.partial` | Utterance (is_final=false) | 1-④ |
        | `utterance.final` | Utterance (is_final=true) | 1-④ |
        | `question.detected` | Question (headline=null) | 1-② 스켈레톤 |
        | `question.headline` | `{question_id, delta}` | 1-② 스트리밍 |
        | `question.completed` | QuestionVerdict | 1-②③ |
        | `gap.created` | KnowledgeGap | 1-② 🔴 표시 |

        지연 목표: 턴 종료 후 `question.headline` 첫 델타까지 1,500ms 이내.
      operationId: streamSession
      responses:
        '101':
          description: 프로토콜 전환됨 (WebSocket)
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------- questions ----------
  /sessions/{sessionId}/questions:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [questions]
      summary: 세션 내 질문 목록
      description: 화면 1-③ 질문 히스토리.
      operationId: listQuestions
      parameters:
        - name: response_mode
          in: query
          schema: { $ref: '#/components/schemas/ResponseMode' }
        - name: intent
          in: query
          schema: { $ref: '#/components/schemas/QuestionIntent' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/QuestionVerdict' }
        '404': { $ref: '#/components/responses/NotFound' }

  /questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [questions]
      summary: 질문 상세
      description: 화면 1-③ 항목 클릭. 판정 카드 전체 내용을 반환한다.
      operationId: getQuestion
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionVerdict' }
        '404': { $ref: '#/components/responses/NotFound' }

  /questions/{questionId}/evidence:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [questions]
      summary: 판정 근거 조회
      description: |
        화면 1-②-1 [근거 보기] 펼침. **지연 로딩 전용 엔드포인트.**

        판정 카드와 함께 내려주지 않는 이유: 1.5초 예산에서 판정이 우선이며
        근거는 사용자가 펼칠 때만 필요하다.

        반환되는 청크는 세션 컨텍스트의 `audience_level` 이하로만 필터링된다.
      operationId: getQuestionEvidence
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                required: [question_id, items]
                properties:
                  question_id: { type: string, format: uuid }
                  applied_audience_level:
                    allOf: [{ $ref: '#/components/schemas/AudienceLevel' }]
                    description: 이 조회에 적용된 공개 등급 상한
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Evidence' }
        '404': { $ref: '#/components/responses/NotFound' }

  /questions/{questionId}/reject:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    post:
      tags: [questions]
      summary: 답변 오류 신고
      description: |
        화면 1-② [답변이 틀렸어요].
        `reason = user_rejected` 인 `knowledge_gap`을 생성한다.
        틀린 답변조차 학습 루프의 입력이 된다.
      operationId: rejectQuestionVerdict
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 1000
                  description: 무엇이 틀렸는지 (선택)
                  example: 이 고객은 이미 NDA를 체결했습니다
      responses:
        '201':
          description: 공백 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeGap' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 신고된 질문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------- deferrals ----------
  /deferrals:
    get:
      tags: [deferrals]
      summary: 지식 공백 목록
      description: |
        화면 2-② 큐 리스트. **기본 정렬은 발생 빈도순.**

        전통적 사내 위키는 "무엇을 써야 할지 모른다"는 이유로 비어 있지만,
        Relay는 대화가 우선순위를 정해 준다.
      operationId: listDeferrals
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/GapStatus' }
        - name: reason
          in: query
          schema: { $ref: '#/components/schemas/GapReason' }
        - $ref: '#/components/parameters/DomainFilter'
        - name: intent
          in: query
          schema: { $ref: '#/components/schemas/QuestionIntent' }
        - name: created_from
          in: query
          description: 이 날짜 이후 생성된 것
          schema: { type: string, format: date }
        - name: created_to
          in: query
          schema: { type: string, format: date }
        - name: sort
          in: query
          description: 정렬 기준
          schema:
            type: string
            enum: [frequency, recent, oldest]
            default: frequency
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/KnowledgeGapSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /deferrals/{deferralId}:
    parameters:
      - $ref: '#/components/parameters/DeferralId'
    get:
      tags: [deferrals]
      summary: 공백 상세
      description: |
        화면 2-③ 상세 패널.
        원문 발화, 발생 세션 이력, **시스템이 미리 찾아둔 GitHub 근거 후보**를 함께 반환한다.
        승인자가 직접 검색하지 않아도 되게 하는 것이 2막의 마찰을 줄이는 핵심이다.
      operationId: getDeferral
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeGapDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deferrals/{deferralId}/resolve:
    parameters:
      - $ref: '#/components/parameters/DeferralId'
    post:
      tags: [deferrals]
      summary: 공백을 답변 규칙으로 해소
      description: |
        화면 2-④ [저장하고 해소]. **이 제품의 핵심 트랜잭션.**

        한 번의 호출로 아래가 원자적으로 수행된다.
        1. `response_rule` 생성
        2. `response_rule.created_from = deferralId`
        3. `knowledge_gap.resolved_by = 생성된 규칙 id`
        4. `knowledge_gap.status = resolved`

        3·4의 양방향 연결이 "쓸수록 좋아진다"의 데이터 증거다.
      operationId: resolveDeferral
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRuleCreate' }
      responses:
        '201':
          description: 해소됨
          content:
            application/json:
              schema:
                type: object
                required: [deferral, policy_rule]
                properties:
                  deferral: { $ref: '#/components/schemas/KnowledgeGap' }
                  policy_rule: { $ref: '#/components/schemas/PolicyRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 해소되었거나 기각된 공백 (동시 편집)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /deferrals/{deferralId}/reject:
    parameters:
      - $ref: '#/components/parameters/DeferralId'
    post:
      tags: [deferrals]
      summary: 공백 기각
      description: 화면 2-④ [기각]. 답변할 수 없는 질문으로 표시한다.
      operationId: rejectDeferral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejection_reason]
              properties:
                rejection_reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: 경쟁사 관련 정보는 대외 답변 대상이 아님
      responses:
        '200':
          description: 기각됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeGap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 처리된 공백
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------- policy-rules ----------
  /policy-rules:
    get:
      tags: [policy-rules]
      summary: 답변 규칙 목록
      description: 화면 3-③ 규칙 리스트.
      operationId: listPolicyRules
      parameters:
        - name: q
          in: query
          description: 질문 패턴 검색어
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/DomainFilter'
        - name: intent
          in: query
          schema: { $ref: '#/components/schemas/QuestionIntent' }
        - name: response_mode
          in: query
          schema: { $ref: '#/components/schemas/ResponseMode' }
        - name: audience_level
          in: query
          schema: { $ref: '#/components/schemas/AudienceLevel' }
        - name: is_active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PolicyRule' }

    post:
      tags: [policy-rules]
      summary: 답변 규칙 직접 생성
      description: |
        공백 없이 선제적으로 규칙을 만드는 경로.
        이 경우 `created_from`은 null이 된다.
      operationId: createPolicyRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRuleCreate' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRule' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /policy-rules/expiring:
    get:
      tags: [policy-rules]
      summary: 만료 임박 규칙
      description: 화면 3-② 만료 임박 알림.
      operationId: listExpiringPolicyRules
      parameters:
        - name: within_days
          in: query
          description: 며칠 이내 만료
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/PolicyRule'
                        - type: object
                          properties:
                            days_left:
                              type: integer
                              description: 만료까지 남은 일수 (계산 필드)
                              example: 3

  /policy-rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    get:
      tags: [policy-rules]
      summary: 규칙 상세
      description: |
        화면 3-③ 상세. `created_from`으로 **어떤 공백에서 태어났는지 역추적**할 수 있고,
        `hit_count`로 실제 사용 횟수를 확인한다.
      operationId: getPolicyRule
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRuleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [policy-rules]
      summary: 규칙 수정
      description: 화면 3-③ 수정·비활성화.
      operationId: updatePolicyRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRuleUpdate' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [policy-rules]
      summary: 규칙 비활성화
      description: |
        물리 삭제하지 않는다. `is_active = false`로 전환한다.
        과거 판정의 근거를 보존해야 하기 때문이다.
      operationId: deactivatePolicyRule
      responses:
        '204':
          description: 비활성화됨
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------- knowledge ----------
  /knowledge/sources:
    get:
      tags: [knowledge]
      summary: 지식 소스 목록
      description: 화면 3-④ 소스 관리.
      operationId: listKnowledgeSources
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/KnowledgeSource' }

    post:
      tags: [knowledge]
      summary: GitHub 레포 연결
      description: |
        화면 3-④ 레포 연결. 연결 즉시 초기 색인이 시작된다.

        인입 시 `source_type`에 따라 `audience_level`이 **강제 지정**된다.

        | source_type | audience_level |
        |---|---|
        | release / changelog / merged_pr | public |
        | open_issue / milestone | internal |

        이 매핑은 LLM 프롬프트가 아니라 인입 파이프라인의 규칙이다.
      operationId: createKnowledgeSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, repo]
              properties:
                provider:
                  type: string
                  enum: [github]
                  default: github
                repo:
                  type: string
                  pattern: '^[\w.-]+/[\w.-]+$'
                  example: supabase/supabase
                access_token:
                  type: string
                  description: 읽기 전용 토큰. 저장 시 암호화된다
                  writeOnly: true
      responses:
        '201':
          description: 연결됨. 초기 색인 시작
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeSource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: GitHub 토큰이 유효하지 않음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 이미 연결된 레포
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /knowledge/reindex:
    post:
      tags: [knowledge]
      summary: 재색인 실행
      description: 화면 3-④ [재색인]. 비동기로 실행되며 진행 상태는 소스 조회로 확인한다.
      operationId: reindexKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id]
              properties:
                source_id: { type: string, format: uuid }
                full:
                  type: boolean
                  default: false
                  description: true면 전체 재색인, false면 증분
      responses:
        '202':
          description: 색인 작업 시작됨
          content:
            application/json:
              schema:
                type: object
                required: [source_id, job_status]
                properties:
                  source_id: { type: string, format: uuid }
                  job_status: { $ref: '#/components/schemas/IndexJobStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 색인이 진행 중
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /knowledge/vocabulary:
    get:
      tags: [knowledge]
      summary: 어휘 사전 조회
      description: |
        화면 3-④ 어휘 사전 표시 + **STT 프롬프트 주입에 사용된다.**

        스모크 테스트에서 이 주입 없이는 한국어 전사가
        `SOC 2 → "사기"`, `SAML → "생리수혜수"` 로 깨져 BM25 검색이 전면 실패했다.
        레포에서 자동 추출한 고유명사를 세션 시작 시 STT에 넘긴다.
      operationId: getVocabulary
      parameters:
        - name: source_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                required: [terms, normalization]
                properties:
                  terms:
                    type: array
                    description: |
                      STT 프롬프트로 주입할 고유명사.
                      **출처: `knowledge_source.vocabulary` jsonb 배열**
                    items: { type: string }
                    example: [SAML, SSO, SOC 2, HIPAA, Edge Functions, Supabase]
                  normalization:
                    type: object
                    description: |
                      음차 전사 정규화 사전.
                      **출처: `knowledge_source.vocabulary` jsonb의 정규화 매핑 항목**
                    additionalProperties: { type: string }
                    example: { 에지 펑션즈: Edge Functions, 쏘씨투: SOC 2 }

  # ---------- metrics ----------
  /metrics/coverage:
    get:
      tags: [metrics]
      summary: 커버리지 지표
      description: |
        화면 3-① 대시보드. **이 제품의 성공 지표.**

        검색 정확도나 응답 속도가 아니라 **"모름"이 줄어드는 속도**를 측정한다.
        모든 값은 `question`과 `knowledge_gap` 집계로 계산되며 별도 집계 테이블이 없다.
      operationId: getCoverageMetrics
      parameters:
        - $ref: '#/components/parameters/DomainFilter'
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter]
            default: week
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }

# =========================================================
components:
# =========================================================

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeferralId:
      name: deferralId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DomainFilter:
      name: domain
      in: query
      description: 도메인 필터. 스키마 변경 없이 값만 바뀐다
      schema: { $ref: '#/components/schemas/Domain' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    BadRequest:
      description: 요청 형식 오류 또는 필수 항목 누락
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: VALIDATION_FAILED
            message: 필수 항목이 누락되었습니다
            details:
              - field: suggested_script
                message: 필수 항목입니다
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: NOT_FOUND
            message: 세션을 찾을 수 없습니다

  schemas:

    # ----- Enum (ERD와 1:1 대응) -----
    Domain:
      type: string
      enum: [sales, recruiting]
      description: 도메인. 채용으로 교체해도 스키마는 불변이다
    SessionStatus:
      type: string
      enum: [active, ended]
    ParticipantRole:
      type: string
      enum: [host, counterpart]
      description: host는 질문 감지 대상이 아니다
    QuestionIntent:
      type: string
      enum: [exists, status, when, price, how, other]
      description: |
        질문 의도. **검색 WHERE 절 필터로 사용된다.**

        임베딩 유사도만으로는 "지원되나요"와 "언제 지원되나요"를 구분할 수 없다
        (스파이크 1 실측: 하드네거티브 최대 유사도 0.859, margin -0.53).
        `when`은 확정 답변 매칭이 금지되어 항상 승인 경로를 탄다.
    ResponseMode:
      type: string
      enum: [direct, conditional, escalate]
      description: direct=초록 / conditional=노랑 / escalate=빨강
    AudienceLevel:
      type: string
      enum: [public, nda, internal]
      description: |
        공개 등급. **LLM 프롬프트가 아니라 검색 WHERE 절에서 적용된다.**
        모델이 실수해도 상위 등급 정보는 애초에 검색되지 않는다.
    DetectionMethod:
      type: string
      enum: [rule, model]
    GapReason:
      type: string
      enum: [no_rule, no_knowledge, condition_unmet, unconfirmed_timeline, user_rejected]
    GapStatus:
      type: string
      enum: [open, resolved, rejected]
    SourceType:
      type: string
      enum: [release, changelog, merged_pr, open_issue, milestone]
    IndexJobStatus:
      type: string
      enum: [idle, running, failed]

    # ----- 공통 -----
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: NOT_FOUND }
        message: { type: string, example: 리소스를 찾을 수 없습니다 }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total: { type: integer, example: 42 }
        limit: { type: integer, example: 20 }
        offset: { type: integer, example: 0 }

    SessionContext:
      type: object
      description: |
        도메인별 상황 변수. **컬럼이 아니라 jsonb인 것이 핵심 설계.**
        세일즈와 채용의 필드가 다르므로 컬럼으로 고정하면
        "스키마 변경 없는 도메인 교체" 검증 조건이 깨진다.
      additionalProperties: true
      example:
        nda_signed: false
        stage: discovery

    # ----- session -----
    SessionCreate:
      type: object
      required: [domain, counterpart_org]
      properties:
        domain: { $ref: '#/components/schemas/Domain' }
        counterpart_org: { type: string, minLength: 1, maxLength: 200, example: Acme Corp }
        context: { $ref: '#/components/schemas/SessionContext' }
        participants:
          type: array
          description: 미지정 시 host/counterpart 각 1명이 자동 생성된다
          items: { $ref: '#/components/schemas/ParticipantCreate' }

    Session:
      type: object
      required: [id, domain, counterpart_org, context, status, started_at]
      properties:
        id: { type: string, format: uuid }
        domain: { $ref: '#/components/schemas/Domain' }
        counterpart_org: { type: string, example: Acme Corp }
        context: { $ref: '#/components/schemas/SessionContext' }
        status: { $ref: '#/components/schemas/SessionStatus' }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [participants]
          properties:
            participants:
              type: array
              items: { $ref: '#/components/schemas/Participant' }
            question_count: { type: integer, description: 계산 필드, example: 7 }
            open_gap_count: { type: integer, description: 계산 필드, example: 2 }

    # ----- participant -----
    ParticipantCreate:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/ParticipantRole' }
        display_name: { type: string, maxLength: 100, nullable: true }
        voice_profile_id:
          type: string
          nullable: true
          description: 대면 환경에서 host 식별용 음성 등록 ID

    Participant:
      type: object
      required: [id, session_id, role]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/ParticipantRole' }
        display_name: { type: string, nullable: true }
        speaker_label:
          type: string
          nullable: true
          maxLength: 10
          description: |
            1:N 확장용. MVP(1:1)에서는 항상 null.
            상대가 여러 명이면 A, B, C가 들어간다. **필드는 지금 존재한다.**
          example: null
        voice_profile_id: { type: string, nullable: true }

    # ----- utterance -----
    UtteranceCreate:
      type: object
      required: [participant_id, text, started_at, ended_at]
      properties:
        participant_id: { type: string, format: uuid }
        text: { type: string, minLength: 1 }
        is_final: { type: boolean, default: true }
        has_question_mark:
          type: boolean
          default: false
          description: STT가 예측한 물음표 유무. 질문 감지 1차 신호
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }

    Utterance:
      type: object
      required: [id, session_id, participant_id, role, text, is_final, started_at, ended_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        participant_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/ParticipantRole' }
        speaker_label: { type: string, nullable: true }
        text: { type: string, example: '저희는 금융권이라 온프레미스 배포 되나요?' }
        is_final: { type: boolean }
        has_question_mark: { type: boolean }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }

    # ----- question -----
    QuestionVerdict:
      type: object
      description: |
        화면 1-② 판정 카드의 전체 페이로드.

        **조인 필드 안내** — `suggested_script`와 `condition`은 `question` 테이블이 아니라
        `matched_rule_id`로 연결된 `response_rule`에서 조인해 온다. 규칙이 원본이며
        질문마다 복제하지 않는다(정규화 유지).
        규칙이 사후 수정되면 과거 판정의 문구도 함께 바뀌는 한계가 있으며,
        감사 이력이 필요해지면 스냅샷 컬럼 추가로 대응한다(고려사항 기재).
      required:
        [id, session_id, utterance_id, raw_text, normalized_text, intent,
         detected_by, response_mode, detected_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        utterance_id: { type: string, format: uuid }
        raw_text: { type: string, example: '저희는 금융권이라 온프레미스 배포 되나요?' }
        normalized_text: { type: string, example: 온프레미스 배포 가능 여부 }
        intent: { $ref: '#/components/schemas/QuestionIntent' }
        detected_by: { $ref: '#/components/schemas/DetectionMethod' }
        response_mode: { $ref: '#/components/schemas/ResponseMode' }
        headline:
          type: string
          nullable: true
          description: AI 생성 한 줄 답변. 스트리밍 중에는 부분 문자열
          example: Enterprise 플랜에서 온프레미스 지원
        suggested_script:
          type: string
          nullable: true
          description: |
            실제로 입에 낼 문구. **출처: `response_rule.suggested_script` (조인)**
          example: Enterprise 플랜에서 온프레미스를 지원합니다. 구체적인 구성은 NDA 체결 후 안내드릴 수 있습니다.
        condition:
          type: string
          nullable: true
          description: |
            conditional일 때 충족되어야 하는 조건.
            **출처: `response_rule.condition` (조인)**
          example: NDA 미체결 — 노드 수·아키텍처 언급 보류
        matched_rule_id: { type: string, format: uuid, nullable: true }
        evidence_count: { type: integer, description: 계산 필드, example: 3 }
        latency_ms:
          type: integer
          nullable: true
          description: 턴 종료 → 첫 토큰. 목표 1500ms 이내
          example: 1180
        detected_at: { type: string, format: date-time }

    Evidence:
      type: object
      description: 화면 1-②-1 근거 항목
      required: [chunk_id, source_type, source_url, content, audience_level]
      properties:
        chunk_id: { type: string, format: uuid }
        source_type: { $ref: '#/components/schemas/SourceType' }
        source_url: { type: string, format: uri, example: 'https://github.com/supabase/supabase/pull/2841' }
        external_ref: { type: string, example: '#2841' }
        heading_path: { type: string, nullable: true, example: 'Self-Hosting > Auth > SAML' }
        content: { type: string }
        audience_level: { $ref: '#/components/schemas/AudienceLevel' }
        valid_from: { type: string, format: date }
        valid_until: { type: string, format: date, nullable: true }

    # ----- deferral (knowledge_gap) -----
    KnowledgeGap:
      type: object
      required: [id, question_id, session_id, domain, question_normalized, intent, reason, status, created_at]
      properties:
        id: { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        domain: { $ref: '#/components/schemas/Domain' }
        question_normalized: { type: string, example: Edge Functions 셀프호스팅 지원 시점 }
        intent: { $ref: '#/components/schemas/QuestionIntent' }
        reason: { $ref: '#/components/schemas/GapReason' }
        status: { $ref: '#/components/schemas/GapStatus' }
        resolved_by:
          type: string
          format: uuid
          nullable: true
          description: 이 공백을 해소한 규칙. policy_rule.created_from과 양방향
        resolved_at: { type: string, format: date-time, nullable: true }
        rejection_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    KnowledgeGapSummary:
      allOf:
        - $ref: '#/components/schemas/KnowledgeGap'
        - type: object
          properties:
            occurrence_count:
              type: integer
              description: |
                동일 정규화 질문의 발생 횟수. **계산 필드이며 기본 정렬 기준.**
                "이 12개에 답해 주세요. 각각 3회, 5회 물어봤습니다."
              example: 5
            first_seen_at: { type: string, format: date-time, description: 계산 필드 }

    KnowledgeGapDetail:
      allOf:
        - $ref: '#/components/schemas/KnowledgeGapSummary'
        - type: object
          properties:
            raw_utterance: { type: string, example: '그거 언제 되나요?' }
            occurrences:
              type: array
              description: 이 질문이 나온 세션 이력
              items:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  counterpart_org: { type: string }
                  detected_at: { type: string, format: date-time }
            evidence_candidates:
              type: array
              description: |
                시스템이 미리 찾아둔 GitHub 근거 후보.
                승인자가 직접 검색하지 않아도 되게 한다.
              items: { $ref: '#/components/schemas/Evidence' }

    # ----- policy-rule (response_rule) -----
    PolicyRuleCreate:
      type: object
      required:
        [domain, question_pattern, intent, response_mode, audience_level,
         headline_template, suggested_script, valid_from]
      properties:
        domain: { $ref: '#/components/schemas/Domain' }
        question_pattern: { type: string, minLength: 1, example: 온프레미스 배포 가능 여부 }
        intent: { $ref: '#/components/schemas/QuestionIntent' }
        response_mode: { $ref: '#/components/schemas/ResponseMode' }
        audience_level: { $ref: '#/components/schemas/AudienceLevel' }
        headline_template: { type: string, minLength: 1, example: Enterprise 플랜에서 온프레미스 지원 }
        suggested_script: { type: string, minLength: 1 }
        condition:
          type: string
          nullable: true
          description: response_mode가 conditional이면 필수
        fallback_script:
          type: string
          nullable: true
          description: 조건 미충족 시 대신 할 말. conditional이면 필수
        authority_role: { type: string, nullable: true, example: 제품팀 리드 }
        chunk_ids:
          type: array
          description: 근거로 연결할 knowledge_chunk (M:N)
          items: { type: string, format: uuid }
        valid_from: { type: string, format: date }
        valid_until: { type: string, format: date, nullable: true }

    PolicyRuleUpdate:
      type: object
      description: 부분 수정. 전달된 필드만 반영된다
      properties:
        question_pattern: { type: string }
        intent: { $ref: '#/components/schemas/QuestionIntent' }
        response_mode: { $ref: '#/components/schemas/ResponseMode' }
        audience_level: { $ref: '#/components/schemas/AudienceLevel' }
        headline_template: { type: string }
        suggested_script: { type: string }
        condition: { type: string, nullable: true }
        fallback_script: { type: string, nullable: true }
        authority_role: { type: string, nullable: true }
        is_active: { type: boolean }
        valid_until: { type: string, format: date, nullable: true }

    PolicyRule:
      type: object
      required:
        [id, domain, question_pattern, intent, response_mode, audience_level,
         headline_template, suggested_script, is_active, valid_from, created_at]
      properties:
        id: { type: string, format: uuid }
        domain: { $ref: '#/components/schemas/Domain' }
        question_pattern: { type: string }
        intent: { $ref: '#/components/schemas/QuestionIntent' }
        response_mode: { $ref: '#/components/schemas/ResponseMode' }
        audience_level: { $ref: '#/components/schemas/AudienceLevel' }
        headline_template: { type: string }
        suggested_script: { type: string }
        condition: { type: string, nullable: true }
        fallback_script: { type: string, nullable: true }
        authority_role: { type: string, nullable: true }
        created_from:
          type: string
          format: uuid
          nullable: true
          description: |
            이 규칙이 태어난 공백. knowledge_gap.resolved_by와 양방향을 이룬다.
            **"쓸수록 좋아진다"는 주장의 데이터 증거.**
        is_active: { type: boolean }
        valid_from: { type: string, format: date }
        valid_until: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PolicyRuleDetail:
      allOf:
        - $ref: '#/components/schemas/PolicyRule'
        - type: object
          properties:
            hit_count:
              type: integer
              description: 이 규칙이 매칭된 횟수. 계산 필드
              example: 12
            source_gap:
              allOf: [{ $ref: '#/components/schemas/KnowledgeGap' }]
              nullable: true
              description: created_from 역추적 결과
            evidence:
              type: array
              items: { $ref: '#/components/schemas/Evidence' }

    # ----- knowledge -----
    KnowledgeSource:
      type: object
      required: [id, provider, repo, job_status]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, example: github }
        repo: { type: string, example: supabase/supabase }
        last_indexed_at: { type: string, format: date-time, nullable: true }
        job_status: { $ref: '#/components/schemas/IndexJobStatus' }
        chunk_count: { type: integer, description: 계산 필드, example: 1842 }
        vocabulary_count: { type: integer, description: 계산 필드, example: 214 }
        ingestion_rules:
          type: array
          description: source_type → audience_level 매핑 (상수). 화면 3-④에 표시
          items:
            type: object
            properties:
              source_type: { $ref: '#/components/schemas/SourceType' }
              audience_level: { $ref: '#/components/schemas/AudienceLevel' }
        created_at: { type: string, format: date-time }

    # ----- metrics -----
    CoverageMetrics:
      type: object
      required: [coverage_rate, open_gap_count, question_count]
      properties:
        coverage_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: '1 - (공백 생성수 / 질문 총수)'
          example: 0.72
        coverage_delta:
          type: number
          format: float
          description: 전 기간 대비 변화량
          example: 0.08
        question_count: { type: integer, example: 143 }
        open_gap_count: { type: integer, example: 12 }
        resolved_gap_count: { type: integer, example: 31 }
        avg_resolution_days: { type: number, format: float, example: 1.4 }
        p50_latency_ms: { type: integer, example: 420 }
        p95_latency_ms: { type: integer, example: 1480 }
        weekly_series:
          type: array
          description: 커버리지 추이. 우상향이 이 제품의 존재 이유
          items:
            type: object
            properties:
              week_start: { type: string, format: date }
              coverage_rate: { type: number, format: float }
              question_count: { type: integer }
              gap_count: { type: integer }
