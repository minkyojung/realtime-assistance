# Relay 로컬 개발용 DB
# pgvector 확장이 포함된 Postgres 이미지를 사용한다.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: relay-db
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5433:5432"   # 로컬 Postgres(5432)와 충돌 회피
    volumes:
      - relay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  relay-pgdata:
